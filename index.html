<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letter Calculator</title>
<style>
  :root {
    --bg: #f4f4f6;
    --panel: #ffffff;
    --text: #1b1b1f;
    --key: #e8e8ee;
    --key-hover: #dcdce5;
    --accent: #3b6cf6;
    --accent-hover: #2f58cf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --panel: #222228;
      --text: #f0f0f4;
      --key: #33333c;
      --key-hover: #42424d;
      --accent: #5b87ff;
      --accent-hover: #7399ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .calculator {
    width: 100%;
    max-width: 380px;
    padding: 16px;
    background: var(--panel);
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
  }
  .display {
    min-height: 64px;
    margin-bottom: 12px;
    padding: 12px;
    text-align: right;
    font-size: 2rem;
    overflow-x: auto;
    white-space: nowrap;
    background: var(--bg);
    border-radius: 10px;
  }
  .row {
    display: grid;
    gap: 8px;
    margin-bottom: 8px;
  }
  .ops { grid-template-columns: repeat(4, 1fr); }
  .letters { grid-template-columns: repeat(6, 1fr); }
  .bottom { grid-template-columns: 1fr 2fr; margin-bottom: 0; }
  button {
    padding: 14px 0;
    font-size: 1.1rem;
    color: var(--text);
    background: var(--key);
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  button:hover { background: var(--key-hover); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.op, button.equals { background: var(--accent); color: #fff; }
  button.op:hover, button.equals:hover { background: var(--accent-hover); }
</style>
</head>
<body>
  <main class="calculator" aria-label="Letter calculator">
    <div class="display" id="display" role="status" aria-live="polite">0</div>

    <div class="row ops">
      <button type="button" class="op" data-action="add" aria-label="Add">+</button>
      <button type="button" class="op" data-action="subtract" aria-label="Subtract">&minus;</button>
      <button type="button" class="op" data-action="multiply" aria-label="Multiply">&times;</button>
      <button type="button" class="op" data-action="divide" aria-label="Divide">&divide;</button>
    </div>

    <div class="row letters" id="letters"></div>

    <div class="row bottom">
      <button type="button" data-action="clear" aria-label="Clear">C</button>
      <button type="button" class="equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>

<script>
  // Letter calculator.
  // Values are letters: a=1, b=2, ... z=26, read as bijective base-26
  // (like spreadsheet columns): "z" = 26, "aa" = 27, "ab" = 28, "az" = 52, "ba" = 53.
  // There is no letter for zero, so zero is shown as "0". Negative results get a "-" prefix.
  // Division is integer division (truncated toward zero), so results stay whole.

  const ZERO = "0";
  const ERROR = "Error";

  // Letters -> BigInt. Handles "-" prefix, "0" and "Error" (both count as 0).
  function toValue(str) {
    if (str === ZERO || str === ERROR || str === "") return 0n;
    let negative = false;
    if (str[0] === "-") { negative = true; str = str.slice(1); }
    let v = 0n;
    for (const ch of str) {
      v = v * 26n + BigInt(ch.charCodeAt(0) - 96);
    }
    return negative ? -v : v;
  }

  // BigInt -> letters.
  function fromValue(n) {
    if (n === 0n) return ZERO;
    const negative = n < 0n;
    if (negative) n = -n;
    let out = "";
    while (n > 0n) {
      n -= 1n;
      out = String.fromCharCode(97 + Number(n % 26n)) + out;
      n /= 26n;
    }
    return negative ? "-" + out : out;
  }

  const state = {
    current: ZERO,      // text currently shown / being typed
    stored: null,       // left-hand operand (BigInt) after pressing an operator
    operator: null,     // "add" | "subtract" | "multiply" | "divide"
    overwrite: false    // true after equals/operator/error, so next letter starts fresh
  };

  const displayEl = document.getElementById("display");

  function render() {
    displayEl.textContent = state.current;
  }

  function inputLetter(ch) {
    if (state.overwrite || state.current === ZERO) {
      state.current = ch;
      state.overwrite = false;
    } else {
      state.current += ch;
    }
    render();
  }

  // Returns the result as a display string, or ERROR on divide by zero.
  function compute() {
    if (!state.operator || state.stored === null) return state.current;
    const a = state.stored;
    const b = toValue(state.current);
    switch (state.operator) {
      case "add":      return fromValue(a + b);
      case "subtract": return fromValue(a - b);
      case "multiply": return fromValue(a * b);
      case "divide":   return b === 0n ? ERROR : fromValue(a / b);
    }
    return state.current;
  }

  function resetPending() {
    state.stored = null;
    state.operator = null;
    state.overwrite = true;
  }

  function chooseOperator(op) {
    // Chain: a + b + c resolves a + b first
    if (state.operator && !state.overwrite) {
      state.current = compute();
      if (state.current === ERROR) {
        resetPending();
        render();
        return;
      }
    }
    state.stored = toValue(state.current);
    state.operator = op;
    state.overwrite = true;
    render();
  }

  function equals() {
    if (!state.operator) return;
    state.current = compute();
    resetPending();
    render();
  }

  function clearAll() {
    state.current = ZERO;
    state.stored = null;
    state.operator = null;
    state.overwrite = false;
    render();
  }

  // Build the a-z keys.
  const lettersEl = document.getElementById("letters");
  for (let i = 0; i < 26; i++) {
    const ch = String.fromCharCode(97 + i);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.dataset.letter = ch;
    btn.textContent = ch;
    btn.title = ch + " = " + (i + 1);
    btn.setAttribute("aria-label", ch + ", value " + (i + 1));
    lettersEl.appendChild(btn);
  }

  document.querySelector(".calculator").addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    if (btn.dataset.letter !== undefined) {
      inputLetter(btn.dataset.letter);
    } else if (btn.dataset.action === "equals") {
      equals();
    } else if (btn.dataset.action === "clear") {
      clearAll();
    } else if (btn.dataset.action) {
      chooseOperator(btn.dataset.action);
    }
  });

  render();
</script>
</body>
</html>
